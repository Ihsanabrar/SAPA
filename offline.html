<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — SAPA</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #F4F6FA;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container { max-width: 400px; }
    .icon { font-size: 5rem; margin-bottom: 20px; }
    h1 { color: #244367; font-size: 1.8rem; margin: 0 0 12px; }
    p { color: #64748B; margin-bottom: 24px; line-height: 1.6; }
    button {
      background: #244367;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      font-size: .95rem;
    }
    button:hover { background: #1B3554; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>Kamu Sedang Offline</h1>
    <p>Sepertinya koneksi internet kamu terputus. Periksa kembali koneksi dan coba lagi.</p>
    <button onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
